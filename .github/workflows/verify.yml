# Runs scripts/verify, the check every branch must pass, on every pull request to master and every push to it.
name: verify

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suite takes a few minutes; some daemon tests allow 120 s each.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The browser tests launch the image's Google Chrome headed, each in an Xvfb display of its own;
      # the PDF tests call poppler.
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb poppler-utils
          google-chrome --version
          pdftotext -v
      - run: scripts/verify
